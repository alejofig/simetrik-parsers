[project]
name = "simetrik-parsers"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.15.3",
    "pydantic>=2.0.0",
    "requests",
    "pandas",
    "pyarrow",
    "xlrd",
    "rarfile",
    "openpyxl",
    "fastparquet",
    "cryptography",
    "beautifulsoup4",
    "python-dotenv",
    "boto3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "ruff>=0.11.8",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
]

[project.scripts]
simetrik-parsers = "simetrik_parsers.cli:app"
